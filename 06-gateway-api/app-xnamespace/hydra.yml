apiVersion: v1
kind: Service
metadata:
  name: svc-hydra
  namespace: ns-hydra
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: hydra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra
  namespace: ns-hydra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hydra
  template:
    metadata:
      labels:
        app: hydra
    spec:
      containers:
      - name: web-hydra
        image: nigelpoulton/k8sbook:gtw-hydra
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-hydra
  namespace: ns-hydra
spec:
  parentRefs:
  - name: gtw-prod-6
    namespace: ns-infra
    sectionName: http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /hydra
    backendRefs:
    - name: svc-hydra
      port: 8080

