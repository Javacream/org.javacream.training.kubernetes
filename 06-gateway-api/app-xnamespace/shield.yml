apiVersion: v1
kind: Service
metadata:
  name: svc-shield
  namespace: ns-shield
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: shield
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shield
  namespace: ns-shield
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shield
  template:
    metadata:
      labels:
        app: shield
    spec:
      containers:
      - name: web-shield
        image: nigelpoulton/k8sbook:gtw-shield
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-shield
  namespace: ns-shield
spec:
  parentRefs:
  - name: gtw-prod-6
    namespace: ns-infra
    sectionName: http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /shield
    backendRefs:
    - name: svc-shield
      port: 8080

