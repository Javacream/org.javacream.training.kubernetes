kind: Deployment
apiVersion: apps/v1
metadata: 
  name: nginx-external
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: web-external
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata: 
      name: nginx-external
      labels:
        app: web-external
    spec:
      volumes:
      - name: pages
        persistentVolumeClaim:
          claimName: one-gig
      containers:
      - name: nginx
        image: nginx
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: pages
---
apiVersion: v1
kind: Service
metadata:
  name: web-external-service
spec:
  selector:
    app: web-external
  type: LoadBalancer
  ports:
  - port: 8082
    targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: one-gig
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
